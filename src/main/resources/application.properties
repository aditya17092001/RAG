spring.application.name=local-rag

# Listen on the platform-provided PORT if set (e.g. Render), else 8080 locally.
server.port=${PORT:8080}

# Actuator: expose only the health endpoint (used by Render's health check).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Active model providers.
# Chat: Ollama locally (default profile); OpenRouter in the 'prod' profile.
# Embeddings: Google Gemini (hosted, free tier) in ALL profiles.
spring.ai.model.chat=ollama
spring.ai.model.embedding=none
spring.ai.model.embedding.text=google-genai

# Ollama connection (chat only, local profile)
spring.ai.ollama.base-url=http://localhost:11434

# Chat model configuration
spring.ai.ollama.chat.model=llama3.2

# Google Gemini text embeddings (text-embedding-004, 768 dims by default)
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=text-embedding-004

# Vector store: Aiven PostgreSQL + pgvector (DB #2, separate from the login DB).
# Connection + PgVectorStore bean are wired manually in VectorStoreConfig
# because the vectors live in a different database than the JPA/login data.
# PgVector auto-config is disabled via @SpringBootApplication(exclude=...) in
# LocalRagApplication so it doesn't register a competing 'vectorStore' bean.
vector.datasource.url=${VECTOR_DB_URL}
vector.datasource.username=${VECTOR_DB_USERNAME}
vector.datasource.password=${VECTOR_DB_PASSWORD}


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB

# JWT Configuration (values from .env)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry=${JWT_EXPIRY}

# H2 Database (file-based, persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/users
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Persist chat memory to H2 (creates SPRING_AI_CHAT_MEMORY table on startup)
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Email (Gmail SMTP) - credentials from .env
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging: your app at DEBUG, everything else at INFO (format defined in logback-spring.xml)
logging.level.com.aditya.rag=DEBUG
