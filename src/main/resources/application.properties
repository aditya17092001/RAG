spring.application.name=local-rag

# Ollama connection
spring.ai.ollama.base-url=http://localhost:11434

# Chat model configuration
spring.ai.ollama.chat.model=llama3.2

# Embedding model configuration
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.embedding.options.num-ctx=8192

# ChromaDB connection
spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8000

# Collection name (like a "table" in ChromaDB)
spring.ai.vectorstore.chroma.collection-name=dsa-knowledge

# Auto-create collection if it doesn't exist
spring.ai.vectorstore.chroma.initialize-schema=true


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB

# JWT Configuration (values from .env)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry=${JWT_EXPIRY}

# H2 Database (file-based, persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/users
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Persist chat memory to H2 (creates SPRING_AI_CHAT_MEMORY table on startup)
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Email (Gmail SMTP) - credentials from .env
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging: your app at DEBUG, everything else at INFO (format defined in logback-spring.xml)
logging.level.com.aditya.rag=DEBUG

