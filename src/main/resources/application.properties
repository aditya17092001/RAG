spring.application.name=local-rag

# Listen on the platform-provided PORT if set (e.g. Render injects PORT), else
# 8080 locally. The health check MUST target this same port. On Render, do not
# pin a different port in the service settings, let it use the injected PORT.
server.port=${PORT:8080}

# Actuator: expose only the health endpoint (used by Render's health check).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Health check should report UP fast without probing external services, so the
# platform marks the service live quickly. In particular the mail indicator
# tries to reach smtp.gmail.com:587, which cloud hosts (e.g. Render) block,
# causing a ~2 min timeout that makes /actuator/health return DOWN/503.
management.endpoint.health.probes.enabled=true
management.health.db.enabled=false
management.health.mail.enabled=false
management.health.ping.enabled=true

# Reduce request-time overhead. NOTE: we intentionally do NOT enable
# spring.main.lazy-initialization - it skipped the Spring AI chat-memory schema
# initializer at startup, so the SPRING_AI_CHAT_MEMORY table was never created
# (queries then failed with "relation does not exist"). Startup-time
# initializers must run eagerly.
spring.jpa.open-in-view=false

# NOTE: Hikari pool settings (connection timeout, pool size, fail-timeout) are
# applied directly on the manually-built DataSources in VectorStoreConfig,
# because spring.datasource.hikari.* auto-binding does not apply to a DataSource
# we construct ourselves.

# Active model providers.
# Chat: Ollama locally (default profile); OpenRouter in the 'prod' profile.
# Embeddings: Google Gemini (hosted, free tier) in ALL profiles.
spring.ai.model.chat=ollama
spring.ai.model.embedding=none
spring.ai.model.embedding.text=google-genai

# Ollama connection (chat only, local profile)
spring.ai.ollama.base-url=http://localhost:11434

# Chat model configuration
spring.ai.ollama.chat.model=llama3.2

# Google Gemini text embeddings. Use gemini-embedding-001 (text-embedding-004
# is no longer served for embedContent). Pin output to 768 dims so it matches
# the PgVector table (vector(768)) configured in VectorStoreConfig.
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

# Vector store: Aiven PostgreSQL + pgvector (DB #2, separate from the login DB).
# Connection + PgVectorStore bean are wired manually in VectorStoreConfig
# because the vectors live in a different database than the JPA/login data.
# PgVector auto-config is disabled via @SpringBootApplication(exclude=...) in
# LocalRagApplication so it doesn't register a competing 'vectorStore' bean.
vector.datasource.url=${VECTOR_DB_URL}
vector.datasource.username=${VECTOR_DB_USERNAME}
vector.datasource.password=${VECTOR_DB_PASSWORD}


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB

# JWT Configuration (values from .env)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry=${JWT_EXPIRY}

# OTP email verification toggle. true = require OTP (needs working email);
# false = skip OTP entirely (use where SMTP is blocked, e.g. Render).
app.otp.enabled=${OTP_ENABLED:true}

# Allowed browser origins for CORS (comma-separated, patterns allowed).
# Defaults cover local dev/preview, VS Code dev tunnels, and common static
# hosts (Render/Netlify/Vercel). Override with CORS_ALLOWED_ORIGINS in prod to
# pin your exact frontend URL.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://*.devtunnels.ms,https://*.onrender.com,https://*.netlify.app,https://*.vercel.app}

# H2 Database (file-based, persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/users
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Persist chat memory to H2 (creates SPRING_AI_CHAT_MEMORY table on startup)
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Email (Gmail SMTP) - credentials from .env
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging: your app at DEBUG, everything else at INFO (format defined in logback-spring.xml)
logging.level.com.aditya.rag=DEBUG
# Embedding diagnostics are emitted by the application services without
# logging chunk contents or credentials. Kafka's error handler DEBUG logging
# shows retry/DLT decisions while the rest of the Kafka client stays at INFO.
logging.level.org.springframework.kafka.listener.DefaultErrorHandler=DEBUG
# Log health endpoint activity + slow health contributors (helps debug Render
# health-check failures and see incoming /actuator/health probes).
logging.level.org.springframework.boot.actuate.endpoint.web=INFO
logging.level.org.springframework.boot.health=INFO
# Silence the harmless "UserDetailsService beans will not be used" warning
# (we intentionally wire a custom DaoAuthenticationProvider in SecurityConfig).
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP}
spring.kafka.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";
# Aiven Kafka CA certificate. The production image copies ca.pem to this
# filesystem path. Override KAFKA_CA_PEM_PATH only when mounting the PEM
# somewhere else (for example, through a platform secret-file mount).
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.location=${KAFKA_CA_PEM_PATH:src/main/resources/ca.pem}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.aditya.rag.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.aditya.rag.kafka.EmbeddingJobMessage
# Consumer: one chunk at a time; the listener factory also uses concurrency 1.
spring.kafka.consumer.group-id=rag-embedding
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.listener.ack-mode=record

# Only these two manually-created Aiven topics are used. Retry attempts stay
# on embedding-jobs; terminal failures are published directly to the DLT.
app.embedding.kafka.topic=embedding-jobs
app.embedding.kafka.dlt-topic=embedding-jobs.DLT
app.embedding.kafka.dlt-group=rag-embedding-dlt
app.embedding.kafka.concurrency=${EMBEDDING_KAFKA_CONCURRENCY:1}
# Gemini free-tier quota-safe defaults: at most 30 embedding requests/minute,
# and allow the provider's approximately one-minute quota window to reset
# before retrying a throttled Kafka record. Render can override these values
# through environment variables when a different paid quota is available.
app.embedding.min-interval-ms=${EMBEDDING_MIN_INTERVAL_MS:2000}
app.embedding.retry.interval-ms=${EMBEDDING_RETRY_INTERVAL_MS:60000}
app.embedding.retry.max-attempts=${EMBEDDING_RETRY_MAX_ATTEMPTS:4}
