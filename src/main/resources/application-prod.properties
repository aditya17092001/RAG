# ==========================================================================
# Production profile: chat runs on OpenRouter (OpenAI-compatible API),
# embeddings stay on Ollama (OpenRouter has no embeddings endpoint).
# Activate with: --spring.profiles.active=prod
# ==========================================================================

# Route chat to OpenAI-compatible provider, keep embeddings on Ollama.
spring.ai.model.chat=openai
spring.ai.model.embedding=ollama

# OpenRouter endpoint. Spring AI appends /v1/chat/completions, so the base
# URL must include the /api segment -> https://openrouter.ai/api/v1/...
spring.ai.openai.base-url=https://openrouter.ai/api

# API key loaded from the environment (.env / deployment secrets).
spring.ai.openai.api-key=${OPENROUTER_API_KEY}

# Model + options.
spring.ai.openai.chat.model=google/gemini-flash-1.5-8b:free
spring.ai.openai.chat.temperature=0.7

# ==========================================================================
# Cloud PostgreSQL (Aiven). Overrides the base H2 datasource in prod.
# Values come from the environment (.env / deployment secrets).
# ==========================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Hibernate manage the schema; use the Postgres dialect.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
