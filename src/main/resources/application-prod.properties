# ==========================================================================
# Production profile: chat runs on OpenRouter (OpenAI-compatible API).
# Embeddings use Google Gemini (inherited from the base application.properties:
# spring.ai.model.embedding=none + spring.ai.model.embedding.text=google-genai).
# Activate with: --spring.profiles.active=prod
# ==========================================================================

# Route chat to the OpenAI-compatible provider (OpenRouter). Embedding settings
# are inherited from application.properties (Gemini) - do NOT re-enable Ollama
# here, there is no Ollama server in the prod container.
spring.ai.model.chat=openai

# OpenRouter endpoint. The official OpenAI Java SDK (used by Spring AI's openai
# starter) appends only "/chat/completions" to the base URL, so the base URL
# MUST already include "/v1": https://openrouter.ai/api/v1
# (Using ".../api" produced ".../api/chat/completions" -> 404: Unknown.)
spring.ai.openai.base-url=https://openrouter.ai/api/v1

# API key loaded from the environment (.env / deployment secrets).
spring.ai.openai.api-key=${OPENROUTER_API_KEY}

# Model + options. The OpenRouter model ID is env-driven (OPENROUTER_MODEL)
# because OpenRouter rotates/deprecates free models often - if you get a
# "404: Unknown" from OpenRouter, the model ID is no longer valid; set
# OPENROUTER_MODEL in the Render dashboard to a current one from
# https://openrouter.ai/models (no redeploy of code needed).
spring.ai.openai.chat.model=${OPENROUTER_MODEL:nvidia/nemotron-3-super-120b-a12b:free}
spring.ai.openai.chat.temperature=0.7

# ==========================================================================
# Cloud PostgreSQL (Aiven). Overrides the base H2 datasource in prod.
# Values come from the environment (.env / deployment secrets).
# ==========================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Hibernate manage the schema; use the Postgres dialect.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
